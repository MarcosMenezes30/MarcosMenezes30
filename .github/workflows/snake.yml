name: Generate contribution snake

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate purple contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23a855f7&color_dots=%23ebedf0,%23e9d5ff,%23c084fc,%23a855f7,%236d28d9
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23c084fc&color_dots=%23161b22,%233b0764,%236d28d9,%239333ea,%23c084fc

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
